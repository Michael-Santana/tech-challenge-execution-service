apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: execution-service
  namespace: execution-service
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
  endpoints:
    - port: http
      path: /api/v1/actuator/prometheus
      interval: 30s
