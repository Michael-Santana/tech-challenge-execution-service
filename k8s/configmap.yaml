apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: execution-service
data:
  SERVER_PORT: "8083"
  MONGODB_HOST: execution-mongodb.execution-service.svc.cluster.local
  MONGODB_DATABASE: execution_service
  MONGODB_USERNAME: execution_service
  RABBITMQ_HOST: rabbitmq.messaging.svc.cluster.local
  RABBITMQ_PORT: "5672"
  OS_EXCHANGE: os.exchangeee
  BILLING_EXCHANGE: billing.exchange
  OUTBOX_DELAY_MS: "1000"
