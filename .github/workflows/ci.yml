name: Execution Service CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify, test and enforce coverage
        run: sh ./mvnw -B clean verify
      - name: SonarQube quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" && test -n "$SONAR_HOST_URL" && test -n "$SONAR_PROJECT_KEY" || { echo "::error::Configure SONAR_TOKEN, SONAR_HOST_URL e SONAR_PROJECT_KEY; PRs de forks nao recebem secrets."; exit 1; }
          args=("-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.qualitygate.wait=true")
          if [ -n "$SONAR_ORGANIZATION" ]; then args+=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          sh ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar "${args[@]}"
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/michael-santana/tech-challenge-execution-service:${{ github.sha }}
            ghcr.io/michael-santana/tech-challenge-execution-service:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: execution-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "::error::Configure KUBE_CONFIG no environment production"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
      - name: Check image pull credentials
        run: |
          kubectl get secret ghcr-pull -n execution-service > /dev/null
      - name: Deploy and wait for rollout
        run: |
          kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml -f k8s/servicemonitor.yaml
          kubectl set image --local -f k8s/deployment.yaml \
            execution-service=ghcr.io/michael-santana/tech-challenge-execution-service:${{ github.sha }} \
            -o yaml | kubectl apply -f -
          kubectl rollout status deployment/execution-service --namespace execution-service --timeout=10m
